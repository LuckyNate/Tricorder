name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.5.0
            chmod +x gradlew
          fi

      - name: Persist Gradle wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "Add Gradle wrapper"
            git push
          fi

      - name: Verify release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRICORDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRICORDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRICORDER_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing TRICORDER_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing TRICORDER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing TRICORDER_KEY_ALIAS"; exit 1; }

      - name: Prepare release signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRICORDER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tricorder-release.jks"

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TRICORDER_KEYSTORE_PATH: ${{ runner.temp }}/tricorder-release.jks
          TRICORDER_KEYSTORE_PASSWORD: ${{ secrets.TRICORDER_KEYSTORE_PASSWORD }}
          TRICORDER_KEY_ALIAS: ${{ secrets.TRICORDER_KEY_ALIAS }}
          TRICORDER_KEY_PASSWORD: ${{ secrets.TRICORDER_KEYSTORE_PASSWORD }}
        run: ./gradlew clean :app:assembleRelease --no-build-cache

      - name: Build debug APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: ./gradlew clean :app:assembleDebug --no-build-cache

      - name: Name latest APK
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            cp app/build/outputs/apk/release/app-release.apk Tricorder-latest.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk Tricorder-latest.apk
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tricorder-${{ env.VERSION }}
          path: Tricorder-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create latest release if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Tricorder — Latest Build" --notes "versionCode=${GITHUB_RUN_NUMBER}\nversionName=0.1.${GITHUB_RUN_NUMBER}\nAutomatically updated APK from main."
          fi

      - name: Update latest release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'versionCode=%s\nversionName=0.1.%s\nAutomatically updated APK from main.\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > release-notes.txt
          gh release edit latest --title "Tricorder — Latest Build" --notes-file release-notes.txt

      - name: Replace latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest Tricorder-latest.apk --clobber
