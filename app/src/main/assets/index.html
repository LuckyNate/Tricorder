<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Tricorder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Geographic map"></div>
    <div id="hud">

      <div id="telemetry"></div>
      <div id="liveTelemetry" style="margin-top:4px;opacity:.9;white-space:pre-line"></div>
    </div>
  </main>
  <script src="https://unpkg.com/maplibre-gl@^5.12.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
  <script src="app.js"></script>
  <script src="live-telemetry.js"></script>

</html>
