<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07110d">
  <title>Tricorder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="viewPane">
      <div id="map"></div>
      <div id="threeDView" aria-hidden="true"></div>
    </section>

    <section id="controls">
      <div id="controlTop">
        <a id="updateBanner"
           href="https://github.com/LuckyNate/Tricorder/releases/download/latest/Tricorder-latest.apk"
           hidden
           style="box-sizing:border-box;display:none;width:100%;padding:10px 12px;border:1px solid #ffd166;border-radius:8px;background:#3a2c09;color:#fff3c4;font:700 13px/1.25 monospace;letter-spacing:.045em;text-decoration:none;text-align:center;">
          UPDATE AVAILABLE — TAP TO DOWNLOAD
        </a>
        <div id="controlStatus">
          <div id="status">Finding location</div>
          <button id="range" type="button" aria-label="Change radar range">100 m radius</button>
        </div>
        <div id="sensorControls" aria-label="Scanner sensor layers"></div>
      </div>

      <button id="modeToggle" type="button" aria-pressed="false">
        <span id="mode3d">3D</span>
        <span class="mode-divider">/</span>
        <span id="mode2d" class="active">2D</span>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="bluetooth-sensor.js"></script>
  <script>
    (function () {
      const updateBanner = document.getElementById('updateBanner');
      const originalOnStatus = window.Tricorder.onStatus.bind(window.Tricorder);
      window.Tricorder.onStatus = function (message) {
        const text = String(message || '');
        const match = text.match(/^Update\s+(0\.1\.\d+)\s+available$/i);
        if (match) {
          updateBanner.hidden = false;
          updateBanner.style.display = 'block';
          updateBanner.textContent = `UPDATE ${match[1]} AVAILABLE — TAP TO DOWNLOAD`;
          return;
        }
        originalOnStatus(message);
      };
    }());
  </script>
</body>
</html>
