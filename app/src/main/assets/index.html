<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07110d">
  <title>Tricorder</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="spatial-view.css">
  <link rel="stylesheet" href="ar-ground-map.css">
</head>
<body>
  <main id="app">
    <section id="viewPane">
      <div id="mapRotator"><div id="map"></div></div>
      <div id="phoneReticle" aria-hidden="true"></div>
      <div id="threeDView" hidden>
        <video id="spatialCamera" autoplay muted playsinline aria-hidden="true"></video>
        <div id="spatialScene" aria-label="3D augmented-reality sensor view"></div>
      </div>
      <div id="startupFault" hidden></div>
    </section>

    <div id="modeDock" aria-label="View mode control">
      <button id="modeToggle" type="button" aria-pressed="false">
        <span id="mode3d">3D</span><span class="mode-divider">/</span><span id="mode2d" class="active">2D</span>
      </button>
    </div>

    <div id="rangeDock" aria-label="Radar range control">
      <button id="range" type="button" aria-label="Change radar range">20 m radius</button>
    </div>

    <section id="controls">
      <div id="controlTop">
        <div id="controlStatus">
          <div id="status">Starting scanner</div>
        </div>
        <div id="sourceStatus" aria-live="polite">Waiting for sensor samples</div>
        <div id="listPanel">
          <div id="sensorControls" aria-label="Scanner display toggles"></div>
          <div id="deviceLists" aria-label="Detected devices"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const fault = document.getElementById('startupFault');
      function showFault(message) {
        if (!fault) return;
        fault.hidden = false;
        fault.textContent = 'SCANNER FAULT: ' + String(message || 'unknown error');
      }
      window.__tricorderShowFault = showFault;
      window.addEventListener('error', function (event) {
        showFault(event.message || (event.error && event.error.message) || 'JavaScript error');
      });
      window.addEventListener('unhandledrejection', function (event) {
        const reason = event.reason;
        showFault(reason && reason.message ? reason.message : reason);
      });
    }());
  </script>
  <script src="world-space.js"></script>
  <script src="scanner-core.js"></script>
  <script src="spatial-view.js"></script>
  <script src="unified-spatial.js"></script>
  <script src="ar-ground-map.js"></script>
  <script src="state-recovery.js"></script>
  <script src="scanner-sensors.js"></script>
  <script src="radio-sensors.js"></script>
  <script src="phone-sensors.js"></script>
  <script src="wifi-peer-sensors.js"></script>
  <script src="app.js"></script>
  <script src="orientation-bridge.js"></script>
  <script src="phone-sensors-bridge.js"></script>
  <script src="wifi-peer-bridge.js"></script>
</body>
</html>
