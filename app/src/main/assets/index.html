<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Tricorder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>
    <div id="map" aria-label="Georeferenced 3D world map"></div>
    <div id="hud">
      <div id="status">Waiting for position</div>
      <div id="telemetry"></div>
    </div>
  </main>
  <script src="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/three@0.180.0/build/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
