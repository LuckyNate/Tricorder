<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07110d">
  <title>Tricorder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="viewPane">
      <div id="map"></div>
      <div id="threeDView" aria-hidden="true"></div>
    </section>

    <section id="controls">
      <div id="controlStatus">
        <div id="status">Finding location</div>
        <button id="range" type="button" aria-label="Change radar range">100 m radius</button>
      </div>

      <button id="modeToggle" type="button" aria-pressed="false">
        <span id="mode3d">3D</span>
        <span class="mode-divider">/</span>
        <span id="mode2d" class="active">2D</span>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
