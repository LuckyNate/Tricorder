<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Tricorder</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>
    <div id="map" aria-label="Geographic map data source"></div>
    <div id="spatialScene" aria-label="Unified 3D world"></div>
    <div id="hud">
      <div id="version">Version: 0.1.258c</div>
      <div id="status">Waiting for position</div>
      <div id="telemetry"></div>
    </div>
  </main>
  <script src="https://unpkg.com/maplibre-gl@^5.12.0/dist/maplibre-gl.js"></script>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';
    window.THREE = THREE;
    await import('./world-space.js');
    await import('./spatial-engine.js');
    await import('./app.js');
  </script>
</body>
</html>
